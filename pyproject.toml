[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kap-mcp"
version = "0.1.0"
description = "KAP public web endpoints exposed as task-oriented MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
kap-mcp = "kap_mcp.server:main"
kap-mcp-smoke = "kap_mcp.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kap_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: calls the live KAP public web API"]
